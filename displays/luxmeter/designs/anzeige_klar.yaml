# Design "Klar" (23.11.2026) fuer das Luxmeter ST7735 160x128. Ausgleich + Fuehlerwert nur 10 s nach
# Drehen/Taste (global offset_zeit in luxmeter.yaml). Schriften Ananda/Coffin aus fonts_verschluesselt.
font:
  - file: 'fonts/Ananda.ttf'
    id: f_titel
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: f_gross
    size: 40
  - file: 'fonts/Coffin.ttf'
    id: f_temp
    size: 33
  - file: 'fonts/Coffin.ttf'
    id: f_mittel
    size: 22
  - file: 'fonts/Coffin.ttf'
    id: f_klein
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: f_mini
    size: 14
  - file: 'fonts/Coffin.ttf'
    id: f_pico
    size: 12

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17

display:
  - platform: st7735
    model: "INITR_REDTAB"
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    device_width: 128
    device_height: 160
    col_start: 0
    row_start: 1
    rotation: 90
    update_interval: 5s
    id: my_display
    lambda: |-
      // Design "Klar": Temperatur gross in der Mitte, darunter Feuchte | Lux und Wind | Luftdruck
      it.fill(Color(0, 0, 0));
      Color gold = Color(255, 205, 60);
      Color orange = Color(255, 150, 30);
      Color blau = Color(90, 170, 255);
      Color gruen = Color(80, 230, 110);
      Color grau = Color(150, 150, 150);
      Color weiss = Color(240, 236, 225);
      bool t_ok = id(temp_sensor).has_state() && !isnan(id(temp_sensor).state);
      float t = t_ok ? id(temp_sensor).state + id(temp_offset) : 0;
      bool h_ok = id(humidity_sensor).has_state() && !isnan(id(humidity_sensor).state);
      bool l_ok = id(lux_sensor).has_state() && !isnan(id(lux_sensor).state);
      bool p_ok = id(aussenluftdruck_sensor).has_state() && !isnan(id(aussenluftdruck_sensor).state);
      bool w_ok = id(wind_speed_kmh).has_state() && !isnan(id(wind_speed_kmh).state);
      // Ausgleich nur 10 s nach Drehen/Taste (oder "GESPEICHERT!")
      bool einstellen = (millis() - id(offset_zeit) < 10000 && id(offset_zeit) != 0) || id(display_trigger).state;
      it.rectangle(0, 0, 160, 128, gold);
      it.print(80, 2, id(f_titel), id(my_wifi).is_connected() ? gold : Color(200, 40, 40), TextAlign::TOP_CENTER, "Egga Lux Meter");
      if (t_ok) it.printf(80, 50, id(f_gross), orange, TextAlign::CENTER, "%.1f°", t);
      else it.print(80, 50, id(f_gross), grau, TextAlign::CENTER, "--.-°");
      it.horizontal_line(10, 74, 140, Color(90, 75, 30));
      if (h_ok) it.printf(10, 88, id(f_klein), blau, TextAlign::CENTER_LEFT, "%.0f %%", id(humidity_sensor).state);
      if (l_ok) it.printf(150, 88, id(f_klein), gold, TextAlign::CENTER_RIGHT, "%.0f lx", id(lux_sensor).state);
      if (w_ok) it.printf(10, 112, id(f_mini), gruen, TextAlign::CENTER_LEFT, "%.1f km/h", id(wind_speed_kmh).state);
      if (p_ok) it.printf(150, 112, id(f_mini), Color(210, 150, 100), TextAlign::CENTER_RIGHT, "%.0f hPa", id(aussenluftdruck_sensor).state);
      if (einstellen) {
        it.filled_rectangle(4, 92, 152, 32, Color(25, 25, 25));
        it.rectangle(4, 92, 152, 32, gold);
        if (id(display_trigger).state) {
          it.print(80, 108, id(f_mini), gruen, TextAlign::CENTER, "GESPEICHERT!");
          id(display_trigger).publish_state(false);
        } else {
          if (t_ok) it.printf(10, 108, id(f_mini), grau, TextAlign::CENTER_LEFT, "Fuehler %.1f", id(temp_sensor).state);
          it.printf(150, 108, id(f_mini), gold, TextAlign::CENTER_RIGHT, "%+.1f", id(temp_offset));
        }
      }
