# Design "Wetter" (23.11.2026) fuer das Luxmeter ST7735 160x128. Ausgleich + Fuehlerwert nur 10 s nach
# Drehen/Taste (global offset_zeit in luxmeter.yaml). Schriften Ananda/Coffin aus fonts_verschluesselt.
font:
  - file: 'fonts/Ananda.ttf'
    id: f_titel
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: f_gross
    size: 40
  - file: 'fonts/Coffin.ttf'
    id: f_temp
    size: 33
  - file: 'fonts/Coffin.ttf'
    id: f_mittel
    size: 22
  - file: 'fonts/Coffin.ttf'
    id: f_klein
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: f_mini
    size: 14
  - file: 'fonts/Coffin.ttf'
    id: f_pico
    size: 12

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17

display:
  - platform: st7735
    model: "INITR_REDTAB"
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    device_width: 128
    device_height: 160
    col_start: 0
    row_start: 1
    rotation: 90
    update_interval: 5s
    id: my_display
    lambda: |-
      // Design "Wetter": links Bild nach Helligkeit (Sonne / Sonne+Wolke / Wolke / Mond), rechts Temperatur gross
      it.fill(Color(0, 0, 0));
      Color gold = Color(255, 205, 60);
      Color orange = Color(255, 150, 30);
      Color blau = Color(90, 170, 255);
      Color gruen = Color(80, 230, 110);
      Color grau = Color(150, 150, 150);
      Color weiss = Color(240, 236, 225);
      bool t_ok = id(temp_sensor).has_state() && !isnan(id(temp_sensor).state);
      float t = t_ok ? id(temp_sensor).state + id(temp_offset) : 0;
      bool h_ok = id(humidity_sensor).has_state() && !isnan(id(humidity_sensor).state);
      bool l_ok = id(lux_sensor).has_state() && !isnan(id(lux_sensor).state);
      bool p_ok = id(aussenluftdruck_sensor).has_state() && !isnan(id(aussenluftdruck_sensor).state);
      bool w_ok = id(wind_speed_kmh).has_state() && !isnan(id(wind_speed_kmh).state);
      // Ausgleich nur 10 s nach Drehen/Taste (oder "GESPEICHERT!")
      bool einstellen = (millis() - id(offset_zeit) < 10000 && id(offset_zeit) != 0) || id(display_trigger).state;
      float lux = l_ok ? id(lux_sensor).state : -1;
      auto wolke = [&](int x, int y, Color c) {
        it.filled_circle(x, y, 11, c); it.filled_circle(x + 14, y - 6, 14, c); it.filled_circle(x + 28, y, 11, c);
        it.filled_rectangle(x, y, 28, 12, c);
      };
      if (lux >= 10000 || (lux >= 300 && lux < 10000)) {
        // Sonne mit Strahlen
        for (int i = 0; i < 12; i++) {
          float a = i * 3.14159f / 6;
          it.line(34 + 17 * cos(a), 40 + 17 * sin(a), 34 + 26 * cos(a), 40 + 26 * sin(a), gold);
        }
        it.filled_circle(34, 40, 14, gold);
        if (lux < 10000) wolke(26, 56, Color(200, 200, 205));   // truebe: Wolke vor der Sonne
      } else if (lux >= 5) {
        wolke(16, 46, Color(170, 170, 180));                     // Daemmerung
      } else {
        it.filled_circle(34, 40, 18, Color(230, 225, 200));      // Nacht: Mond + Sterne
        it.filled_circle(44, 33, 16, Color(0, 0, 0));
        it.draw_pixel_at(12, 18, weiss); it.draw_pixel_at(56, 62, weiss); it.draw_pixel_at(60, 16, weiss);
      }
      if (t_ok) it.printf(156, 24, id(f_temp), orange, TextAlign::CENTER_RIGHT, "%.1f°", t);
      if (h_ok) it.printf(156, 56, id(f_klein), blau, TextAlign::CENTER_RIGHT, "%.0f %%", id(humidity_sensor).state);
      it.horizontal_line(6, 82, 148, Color(90, 75, 30));
      if (l_ok) it.printf(6, 96, id(f_mini), gold, TextAlign::CENTER_LEFT, "%.0f lx", lux);
      if (p_ok) it.printf(154, 96, id(f_mini), Color(210, 150, 100), TextAlign::CENTER_RIGHT, "%.0f hPa", id(aussenluftdruck_sensor).state);
      if (w_ok) it.printf(80, 116, id(f_mini), gruen, TextAlign::CENTER, "Wind %.1f km/h", id(wind_speed_kmh).state);
      if (einstellen) {
        it.filled_rectangle(4, 92, 152, 32, Color(25, 25, 25));
        it.rectangle(4, 92, 152, 32, gold);
        if (id(display_trigger).state) {
          it.print(80, 108, id(f_mini), gruen, TextAlign::CENTER, "GESPEICHERT!");
          id(display_trigger).publish_state(false);
        } else {
          if (t_ok) it.printf(10, 108, id(f_mini), grau, TextAlign::CENTER_LEFT, "Fuehler %.1f", id(temp_sensor).state);
          it.printf(150, 108, id(f_mini), gold, TextAlign::CENTER_RIGHT, "%+.1f", id(temp_offset));
        }
      }
