# =====================================================================
#  Raumluft Stube by Ossi - Geraete-Datei (wird von GitHub gebaut)
#  Geraet in HA: co-ossi-stube (Name bleibt, sonst aendern sich die Entitaeten).
#  Sensoren: ZE15-CO (Kohlenmonoxid, analog GPIO1), SCD4x (CO2/Temp/Feuchte, I2C 0x62).
#  Passwoerter/Schluessel kommen aus den GitHub-Secrets (secrets.yaml
#  wird beim Bauen erzeugt). Anzeige: anzeige.yaml (aktives Design).
#  Selbst-Update: das Geraet prueft alle 30 s das Manifest im Zweig
#  "firmware" und spielt eine neue Version selbst ein.
# =====================================================================
substitutions:
  fw_version: "0"                 # setzt GitHub beim Bauen auf die Build-Nummer
  manifest_url: https://raw.githubusercontent.com/Eggaossi/ESPHome-Displays/firmware/raumluft-stube/manifest.json

esphome:
  name: co-ossi-stube
  friendly_name: CO-Ossi-Stube
  project:
    name: ossi.raumluft_stube
    version: ${fw_version}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 115200

api:
  encryption:
    key: !secret raumluft_stube_api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: http_request

http_request:
  verify_ssl: false
  timeout: 30s

update:
  - platform: http_request
    id: fw_update
    name: Firmware GitHub
    source: ${manifest_url}
    update_interval: 30s
    # neue Version gefunden -> sofort selbst einspielen
    on_update_available:
      then:
        - logger.log: "Neue Firmware auf GitHub - spiele sie ein"
        - update.perform: fw_update

# Reserve, falls der Ausloeser oben einmal nicht greift
interval:
  - interval: 1min
    startup_delay: 1min
    then:
      - if:
          condition:
            update.is_available: fw_update
          then:
            - update.perform: fw_update

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Co-Ossi-Stube Fallback Hotspot"
    password: !secret ota_password

captive_portal:

packages:
  anzeige: !include anzeige.yaml
