# =====================================================================
#  Raumluft Stube by Ossi - Anzeige-Teil (Package fuer ESPHome)
#  DESIGN "Klassik Anton": Aufbau wie das Original (Datum/Uhr gross, Aussentemperatur sehr gross, Innen + Feuchte
#  gross unten), Schrift Anton (Google Fonts, OFL) - schmal und kraeftig wie Cabaret, CO2 als kleiner Farbbogen
#  links. Aussentemperatur passt sich an (120 -> 100 -> 84 px), damit z.B. -25 Grad nicht ueberlaeuft.
#  KEINE Passwoerter/Schluessel (Repo oeffentlich).
# =====================================================================

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - de.pool.ntp.org

# Schriftarten-Konfiguration
font:
  - file: "gfonts://Anton"
    id: an13
    size: 13
  - file: "gfonts://Anton"
    id: an16
    size: 16
  - file: "gfonts://Anton"
    id: an18
    size: 18
  - file: "gfonts://Anton"
    id: an20
    size: 20
  - file: "gfonts://Anton"
    id: an44
    size: 44
    glyphs: "-0123456789.°C%"
  - file: "gfonts://Anton"
    id: an56
    size: 56
    glyphs: "0123456789.:"
  - file: "gfonts://Anton"
    id: an84
    size: 84
    glyphs: "-0123456789°"
  - file: "gfonts://Anton"
    id: an100
    size: 100
    glyphs: "-0123456789°"
  - file: "gfonts://Anton"
    id: an120
    size: 120
    glyphs: "-0123456789°"

# Knopf in HA: sofort nach neuer Firmware schauen
button:
  - platform: template
    name: "Jetzt Update holen"
    on_press:
      - script.execute: update_jetzt

script:
  - id: update_jetzt
    then:
      - component.update: fw_update
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(fw_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - update.perform: fw_update

# I2C Konfiguration
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

# SPI Konfiguration
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17

# Binary Sensor für Fehlererkennung
binary_sensor:
  - platform: template
    name: "ZE15 Sensor Fehler"
    id: sensor_error
    lambda: |-
      if (id(outside_temp).has_state()) {
        float temp_aussen = id(outside_temp).state;
        if (temp_aussen > 100 || temp_aussen < -100) {
          return true;  // Außentemperatur Fehler
        }
      }
      
      if (id(temperature_value).has_state()) {
        float temp_innen = id(temperature_value).state;
        if (temp_innen > 100 || temp_innen < -100) {
          return true;  // Innentemperatur Fehler
        }
      }
      
      if (id(co_value).has_state()) {
        if (isnan(id(co_value).state)) {
          return true;  // CO Fehler
        }
      }
      
      if (id(humidity_value).has_state()) {
        float humidity = id(humidity_value).state;
        if (humidity < 0 || humidity > 100) {
          return true;  // Luftfeuchtigkeits Fehler
        }
      }
      
      return false;  // Kein Fehler

# Sensor Konfigurationen
sensor:
  - platform: adc
    pin: GPIO1
    name: "CO Raw"
    id: co_raw_value
    update_interval: 5s
    attenuation: 12db
    accuracy_decimals: 3
    unit_of_measurement: "V"

  - platform: template
    name: "CO-Wert"
    id: co_value
    # CO: sofort bei >= 1 ppm Aenderung, sonst hoechstens alle 5 min (22.11.2026: weniger Datenbank-Eintraege in HA)
    filters:
      - or:
          - delta: 1.0
          - throttle: 300s
    unit_of_measurement: "ppm"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (id(co_raw_value).has_state()) {
        float raw = id(co_raw_value).state;
        // Lineare Kalibrierung von 0 ppm (bei 0.350V) bis 500 ppm (bei 2.0V)
        if (raw <= 0.350f) return 0.0f;
        return (raw - 0.350f) * (500.0f / (2.0f - 0.350f));
      }
      return 0.0f;

  # SCD4x Sensor
  - platform: scd4x
    co2:
      id: co2_value
      # CO2: sofort bei >= 10 ppm Aenderung, sonst hoechstens alle 5 min (22.11.2026: weniger Datenbank-Eintraege in HA)
      filters:
        - or:
            - delta: 10.0
            - throttle: 300s
      name: "Stube-CO2-Wert"
      accuracy_decimals: 1
    temperature:
      id: temperature_value
      # Temperatur: sofort bei >= 0,2 Grad, sonst hoechstens alle 5 min (22.11.2026: weniger Datenbank-Eintraege in HA)
      filters:
        - or:
            - delta: 0.2
            - throttle: 300s
      name: "Stube-Temperatur"
      accuracy_decimals: 1
    humidity:
      id: humidity_value
      # Feuchte: sofort bei >= 1 %, sonst hoechstens alle 5 min (22.11.2026: weniger Datenbank-Eintraege in HA)
      filters:
        - or:
            - delta: 1.0
            - throttle: 300s
      name: "Stube-Luftfeuchtigkeit"
      accuracy_decimals: 1
    address: 0x62
    update_interval: 15s

  # Home Assistant Sensor
  - platform: homeassistant
    id: outside_temp
    entity_id: sensor.luxmeter_lux_korrigierte_temperatur
    name: "Außentemperatur"

# Display Konfiguration
display:
  - platform: ili9xxx
    model: ST7789v
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    color_palette: 8BIT
    rotation: 90
    invert_colors: false
    update_interval: 15s
    lambda: |-
      // ===== Design Klassik Anton (320x240), alle Texte an der Grundlinie ausgerichtet (BASELINE) =====
      const Color WEISS(255, 255, 255), GRAU(146, 146, 85), GELBGRUEN(210, 243, 119);
      auto breite = [&](const char* t, auto f) -> int {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, t, f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        return w;
      };

      // ================= Kopf: Datum links, Uhr rechts, Wochentag =================
      auto time = id(sntp_time).now();
      if (time.is_valid()) {
        it.printf(2, 58, id(an56), GELBGRUEN, TextAlign::BASELINE_LEFT, "%02d.%02d.%02d",
          time.day_of_month, time.month, time.year % 100);
        int h12 = time.hour % 12;
        if (h12 == 0) h12 = 12;
        it.printf(318, 58, id(an56), GELBGRUEN, TextAlign::BASELINE_RIGHT, "%d:%02d", h12, time.minute);
        const char* tage[] = {"Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
        it.print(2, 80, id(an20), WEISS, TextAlign::BASELINE_LEFT, tage[(time.day_of_week + 6) % 7]);
      }

      // ================= Aussentemperatur sehr gross, mittig in x 112..318 =================
      if (id(outside_temp).has_state() && id(outside_temp).state > -100 && id(outside_temp).state < 100) {
        int tr = int(roundf(id(outside_temp).state));
        Color tc;
        if (tr < -10) tc = Color(109, 146, 255);       // Frost hell, auf Schwarz gut sichtbar
        else if (tr < -5) tc = Color(0, 146, 255);
        else if (tr < 0) tc = Color(0, 219, 255);
        else if (tr < 5) tc = Color(0, 255, 128);
        else if (tr < 10) tc = Color(192, 255, 64);
        else if (tr < 15) tc = Color(255, 255, 0);
        else if (tr < 20) tc = Color(255, 128, 0);
        else if (tr < 25) tc = Color(255, 200, 0);
        else if (tr < 30) tc = Color(255, 255, 255);
        else tc = Color(255, 255, 128);
        char b[8];
        snprintf(b, sizeof(b), "%d°", tr);
        // groesste Schrift, die in 200 px passt
        auto f = id(an120);
        if (breite(b, f) > 200) f = id(an100);
        if (breite(b, f) > 200) f = id(an84);
        it.print(215, 168, f, tc, TextAlign::BASELINE_CENTER, b);
      } else {
        it.print(215, 168, id(an84), GRAU, TextAlign::BASELINE_CENTER, "--");
      }

      // ================= CO2 klein links: Farbbogen =================
      auto farbe = [](float v) -> Color {
        if (v < 800) return Color(0, 219, 0);
        if (v < 1000) return Color(109, 219, 0);
        if (v < 1400) return Color(219, 219, 0);
        if (v < 2000) return Color(255, 109, 0);
        return Color(255, 0, 0);
      };
      const int CX = 48, CY = 126, RA = 40, DI = 7;
      bool hat_co2 = id(co2_value).has_state() && !isnan(id(co2_value).state);
      int co2 = hat_co2 ? (int) id(co2_value).state : 0;
      for (int dy = -RA; dy <= RA; dy++) {
        for (int dx = -RA; dx <= RA; dx++) {
          int d2 = dx * dx + dy * dy;
          if (d2 < (RA - DI) * (RA - DI) || d2 > RA * RA) continue;
          float g = atan2f(dy, dx) * 180.0f / M_PI - 150.0f;
          while (g < 0) g += 360.0f;
          if (g > 240.0f) continue;
          int i = (int) (g / 16.0f);
          if (g - i * 16.0f > 13.0f) continue;
          float v = 400.0f + 2000.0f * (i + 0.5f) / 15.0f;
          Color c = farbe(v);
          if (!hat_co2 || v > co2) c = Color(c.r / 5, c.g / 5, 0);
          it.draw_pixel_at(CX + dx, CY + dy, c);
        }
      }
      it.print(CX, CY - 15, id(an13), GRAU, TextAlign::CENTER, "CO2");
      if (hat_co2) it.printf(CX, CY + 2, id(an20), farbe(co2), TextAlign::CENTER, "%d", co2);
      else it.print(CX, CY + 2, id(an20), GRAU, TextAlign::CENTER, "----");
      bool co_da = id(co_value).has_state() && !isnan(id(co_value).state);
      float co = co_da ? id(co_value).state : 0;
      {
        const char* st = "--";
        Color sc = GRAU;
        if (hat_co2) {
          sc = farbe(co2);
          st = co2 < 800 ? "SEHR GUT" : co2 < 1000 ? "GUT" : co2 < 1400 ? "LUEFTEN" : co2 < 2000 ? "LUEFTEN!" : "SOFORT!";
        }
        if (co_da && co >= 50) { st = "CO GEFAHR"; sc = Color(255, 0, 0); }
        it.print(CX, CY + 20, id(an13), sc, TextAlign::CENTER, st);
      }

      // ================= CO-Zeile =================
      if (co_da) {
        Color cc = co < 25 ? Color(28, 185, 115) : co < 50 ? Color(255, 255, 0) : co < 100 ? Color(255, 165, 0) : Color(255, 0, 0);
        it.printf(2, 188, id(an18), cc, TextAlign::BASELINE_LEFT, "CO %.1f ppm", co);
      } else {
        it.print(2, 188, id(an18), Color(255, 0, 0), TextAlign::BASELINE_LEFT, "CO Sensor Fehler");
      }

      // ================= Unten gross: Innentemperatur, Feuchte =================
      if (id(temperature_value).has_state() && id(temperature_value).state > -100 && id(temperature_value).state < 100)
        it.printf(2, 238, id(an44), Color(0, 255, 0), TextAlign::BASELINE_LEFT, "%d°C", int(roundf(id(temperature_value).state)));
      it.print(160, 234, id(an16), GRAU, TextAlign::BASELINE_CENTER, "innen");
      if (id(humidity_value).has_state() && id(humidity_value).state >= 0 && id(humidity_value).state <= 100)
        it.printf(318, 238, id(an44), Color(187, 94, 199), TextAlign::BASELINE_RIGHT, "%d%%", int(roundf(id(humidity_value).state)));
