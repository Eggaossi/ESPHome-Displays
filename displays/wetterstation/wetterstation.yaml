# =====================================================================
#  Wetterstation by Ossi - Geraete-Datei (wird von GitHub gebaut)
#  Passwoerter/Schluessel kommen aus den GitHub-Secrets (secrets.yaml
#  wird beim Bauen erzeugt). Anzeige: anzeige.yaml (aktives Design).
#  Selbst-Update: das Geraet prueft alle 30 s das Manifest im Zweig
#  "firmware" und spielt eine neue Version selbst ein.
# =====================================================================
substitutions:
  fw_version: "0"                 # setzt GitHub beim Bauen auf die Build-Nummer
  manifest_url: https://raw.githubusercontent.com/Eggaossi/ESPHome-Displays/firmware/wetterstation/manifest.json

esphome:
  name: wetterstation-display
  friendly_name: Wetterstation-Display
  project:
    name: ossi.wetterstation
    version: ${fw_version}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret wetterstation_api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: http_request

http_request:
  verify_ssl: false
  timeout: 30s

update:
  - platform: http_request
    id: fw_update
    name: Firmware GitHub
    source: ${manifest_url}
    update_interval: 30s
    # neue Version gefunden -> sofort selbst einspielen
    on_update_available:
      then:
        - logger.log: "Neue Firmware auf GitHub - spiele sie ein"
        - update.perform: fw_update

# Reserve, falls der Ausloeser oben einmal nicht greift
interval:
  - interval: 1min
    startup_delay: 1min
    then:
      - if:
          condition:
            update.is_available: fw_update
          then:
            - update.perform: fw_update

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wetterstation-Display"
    password: !secret ota_password

captive_portal:

packages:
  anzeige: !include anzeige.yaml
