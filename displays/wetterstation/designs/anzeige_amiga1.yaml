# =====================================================================
#  Wetterstation by Ossi - Anzeige-Teil (Package fuer ESPHome)
#  DESIGN "Amiga1" (vom Nutzer benannt, 20.11.2026): Workbench 1.3, VT323, Boing-Ball
#  Wird von der Geraete-YAML im ESPHome Builder per "packages:" geholt.
#  Hier stehen: Zeit, Schriften, Taster, LEDs, Sensoren aus Home Assistant
#  und die Display-Zeichnung. KEINE Passwoerter/Schluessel (Repo oeffentlich).
#  Eigene Schriften (Ananda, Coffin, Cabaret, Roboto-Regular) liegen in
#  Home Assistant unter /config/esphome/fonts/.
# =====================================================================

globals:
  # Tages-Tiefst/Hoechst der Aussentemperatur (bleibt auch nach Neustart)
  - id: hz_min
    type: float
    restore_value: true
    initial_value: '1000'
  - id: hz_max
    type: float
    restore_value: true
    initial_value: '-1000'
  - id: hz_tag
    type: int
    restore_value: true
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

font:
  - file: '/config/esphome/fonts/Ananda.ttf'
    id: my_font_ananda
    size: 26
  - file: '/config/esphome/fonts/Ananda.ttf'
    id: my_font_cabaret_klein
    size: 24
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin
    size: 28
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_miniklein
    size: 15
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_klein
    size: 18
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_benu
    size: 20
  # Riesige Aussentemperatur: nur die noetigen Zeichen, spart viel Speicher
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_gross
    size: 200
    glyphs: "-0123456789°"
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_extra
    size: 32
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_cabaret
    size: 37
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_minicabaret
    size: 26
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_miniminicabaret
    size: 22
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_groscabaret
    size: 40
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font
    size: 25
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font_medium
    size: 35
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font_large
    size: 50
  # Gut lesbare Schrift fuer kleine Texte (Roboto Bold, ESPHome laedt sie selbst)
  - file:
      type: gfonts
      family: Roboto
      weight: 900   # Black: bei 1-Bit-Darstellung wird die "1" sonst nur 1 Pixel breit
    id: rb13
    size: 13
  - file:
      type: gfonts
      family: Roboto
      weight: 900   # Black: bei 1-Bit-Darstellung wird die "1" sonst nur 1 Pixel breit
    id: rb14
    size: 14
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb16
    size: 16
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb18
    size: 18
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb28
    size: 28
  # Schrift dieses Designs: VT323 (Pixel-/Terminalschrift wie am Amiga)
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt_gross
    size: 150
    glyphs: "-0123456789"
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt_gross_k
    size: 110
    glyphs: "-0123456789"
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt40
    size: 40
    glyphs: "°"
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt20
    size: 20
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt24
    size: 24
  - file:
      type: gfonts
      family: VT323
      weight: 400
    id: vt32
    size: 32
  # Symbole (Material Design Icons), ESPHome laedt die Datei beim Kompilieren
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 24
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny
      - "\U000F048B"  # server
      - "\U000F0241"  # flash
      - "\U000F0813"  # bitcoin
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_klein
    size: 18
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny

