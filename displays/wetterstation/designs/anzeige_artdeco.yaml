  - platform: homeassistant
    id: sensor_thermo_hygrometer_2_temperatur
    entity_id: sensor.thermo_hygrometer_2_temperatur
  - platform: homeassistant
    id: sensor_thermo_hygrometer_2_luftfeuchtigkeit
    entity_id: sensor.thermo_hygrometer_2_luftfeuchtigkeit
  - platform: homeassistant
