# =====================================================================
#  Wetterstation by Ossi - Anzeige-Teil (Package fuer ESPHome)
#  DESIGN "Art deco" (Entwurf, 20.11.2026): Schwarz, Gold, Champagner; Limelight, Federo, Josefin Sans; Faecher, gestufte Ecken
#  Wird von der Geraete-YAML per "packages:" geholt (Auswahl ueber design.txt / App HA-Displays).
#  Hier stehen: Zeit, Schriften, Taster, LEDs, Sensoren aus Home Assistant
#  und die Display-Zeichnung. KEINE Passwoerter/Schluessel (Repo oeffentlich).
# =====================================================================

globals:
  # Tages-Tiefst/Hoechst der Aussentemperatur (bleibt auch nach Neustart)
  - id: hz_min
    type: float
    restore_value: true
    initial_value: '1000'
  - id: hz_max
    type: float
    restore_value: true
    initial_value: '-1000'
  - id: hz_tag
    type: int
    restore_value: true
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

font:
  - file:
      type: gfonts
      family: Limelight
      weight: 400
    id: ad_temp
    size: 130
    glyphs: "-0123456789"
  - file:
      type: gfonts
      family: Limelight
      weight: 400
    id: ad_temp_k
    size: 96
    glyphs: "-0123456789"
  - file:
      type: gfonts
      family: Limelight
      weight: 400
    id: ad_grad
    size: 40
    glyphs: "°"
  - file:
      type: gfonts
      family: Federo
      weight: 400
    id: fe18
    size: 18
  - file:
      type: gfonts
      family: Federo
      weight: 400
    id: fe14
    size: 14
  - file:
      type: gfonts
      family: Josefin Sans
      weight: 700
    id: js13
    size: 13
  - file:
      type: gfonts
      family: Josefin Sans
      weight: 700
    id: js15
    size: 15
  - file:
      type: gfonts
      family: Josefin Sans
      weight: 700
    id: js17
    size: 17
  - file:
      type: gfonts
      family: Josefin Sans
      weight: 700
    id: js20
    size: 20
  - file:
      type: gfonts
      family: Josefin Sans
      weight: 700
    id: js26
    size: 26
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_klein
    size: 18
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny

# Knopf in Home Assistant: sofort nach neuer Firmware schauen und einspielen
button:
  - platform: template
    name: "Jetzt Update holen"
    on_press:
      - script.execute: update_jetzt

script:
  - id: update_jetzt
    then:
      - component.update: fw_update
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(fw_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - update.perform: fw_update

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 1"
    id: wetterstation_taster_1
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 1 wurde gedrückt!"
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 2"
    id: wetterstation_taster_2
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 2 wurde gedrückt!"
      # Taster 2: sofort nach neuer Firmware auf GitHub schauen
      - script.execute: update_jetzt
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 3"
    id: wetterstation_taster_3
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 3 wurde gedrückt!"

output:
  - platform: gpio
    pin: GPIO14
    id: wetterstation_led_1
  - platform: gpio
    pin: GPIO13
    id: wetterstation_led_2
  - platform: gpio
    pin: GPIO12
    id: wetterstation_led_3

light:
  - platform: binary
    name: "Wetterstation-LED 1"
    output: wetterstation_led_1
  - platform: binary
    name: "Wetterstation-LED 2"
    output: wetterstation_led_2
  - platform: binary
    name: "Wetterstation-LED 3"
    output: wetterstation_led_3

