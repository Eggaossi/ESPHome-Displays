display:
  - platform: ili9xxx
    model: ST7796
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    color_palette: 8bit
    rotation: 0
    invert_colors: false
    update_interval: 5s
    id: anzeige_display
    pages:
      - id: seite_haupt
        lambda: |-
          // =========== Design "Nixie": Bernstein auf Schwarz, Temperatur in Roehren ===========
          const Color SCHWARZ  = Color(0, 0, 0);
          const Color AMBER    = Color(255, 182, 0);
          const Color AMBER_M  = Color(219, 146, 0);
          const Color AMBER_D  = Color(146, 73, 0);
          const Color GLUT     = Color(255, 219, 73);    // heller Kern der Ziffer
          const Color GLUT_R   = Color(219, 73, 0);      // innerer Schein
          const Color GLUT_A   = Color(109, 36, 0);      // aeusserer Schein
          const Color GITTER   = Color(36, 0, 0);
          const Color GLAS     = Color(73, 73, 85);
          const Color LINIE    = Color(73, 36, 0);
          const Color GRUEN    = Color(146, 219, 0);
          const Color GELB     = Color(255, 255, 0);
          const Color ROT      = Color(255, 36, 0);

          it.fill(SCHWARZ);

          // ----- Helfer -----
          auto trenn = [&](int y) {
            it.horizontal_line(10, y, 300, LINIE);
            it.filled_circle(160, y, 2, AMBER_D);
          };
          // gluehender Text: Schein aussen, Schein innen, heller Kern
          auto gluehen = [&](int x, int y, esphome::display::BaseFont *f, TextAlign a, const char *txt, int r) {
            for (int dx = -r; dx <= r; dx++)
              for (int dy = -r; dy <= r; dy++)
                if (dx * dx + dy * dy <= r * r && (dx != 0 || dy != 0))
                  it.print(x + dx, y + dy, f, (dx * dx + dy * dy > 2) ? GLUT_A : GLUT_R, a, txt);
            it.print(x, y, f, AMBER, a, txt);
          };
          // eine Nixie-Roehre mit Ziffer z (oder leer)
          auto roehre = [&](int x, int y, int w, int h, char z) {
            // Glas
            it.rectangle(x + 4, y, w - 8, h, GLAS);
            it.rectangle(x, y + 4, w, h - 8, GLAS);
            it.filled_circle(x + 4, y + 4, 4, GLAS);  it.filled_circle(x + w - 5, y + 4, 4, GLAS);
            it.filled_circle(x + 4, y + h - 5, 4, GLAS);  it.filled_circle(x + w - 5, y + h - 5, 4, GLAS);
            it.filled_rectangle(x + 1, y + 1, w - 2, h - 2, SCHWARZ);
            it.filled_rectangle(x + w / 2 - 4, y - 5, 8, 6, GLAS);           // Spitze oben
            it.filled_rectangle(x + 2, y + h - 10, w - 4, 10, Color(36, 36, 0)); // Sockel
            // Anodengitter (feines Raster)
            for (int gx = x + 6; gx < x + w - 3; gx += 8) it.vertical_line(gx, y + 3, h - 14, GITTER);
            for (int gy = y + 6; gy < y + h - 12; gy += 8) it.horizontal_line(x + 3, gy, w - 6, GITTER);
            // dunkle Ersatzziffer dahinter (wie die nicht leuchtenden Kathoden)
            it.print(x + w / 2, y + 8, id(nixie_ziffer), Color(36, 0, 0), TextAlign::TOP_CENTER, "8");
            if (z != ' ') {
              char s[2] = {z, 0};
              gluehen(x + w / 2, y + 8, id(nixie_ziffer), TextAlign::TOP_CENTER, s, 2);
            }
          };

          // ----- Kopf -----
          it.print(12, 8, id(rb16), AMBER_M, "WETTERSTATION");
          auto time = id(sntp_time).now();
          if (time.is_valid()) {
            const char *wochentage[] = {"Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"};
            it.printf(12, 30, id(rb14), AMBER_D, "%s, %02d.%02d.%04d",
              wochentage[(time.day_of_week + 5) % 7], time.day_of_month, time.month, time.year);
            char uhr[6];
            snprintf(uhr, sizeof(uhr), "%02d:%02d", time.hour, time.minute);
            gluehen(308, 4, id(nixie_uhr), TextAlign::TOP_RIGHT, uhr, 1);
          } else {
            it.print(12, 30, id(rb14), AMBER_D, "warte auf Zeit...");
          }
          trenn(52);

          // ----- Aussentemperatur in Roehren -----
          it.print(12, 58, id(rb13), AMBER_D, "AUSSEN");
          if (id(sensor_luxmeter_lux_korrigierte_temperatur).has_state()) {
            char txt[12];
            snprintf(txt, sizeof(txt), "%.1f", id(sensor_luxmeter_lux_korrigierte_temperatur).state);
            // Ziffern ohne Punkt sammeln, Punkt-Position merken
            char z[8]; int n = 0, punkt = -1;
            for (int i = 0; txt[i] && n < 6; i++) {
              if (txt[i] == '.') punkt = n; else z[n++] = txt[i];
            }
            int w = (n >= 4) ? 56 : 62, gap = (n >= 4) ? 8 : 12, h = 146;
            int breite = n * w + (n - 1) * gap;
            int x0 = 160 - breite / 2 - 14;
            for (int i = 0; i < n; i++) {
              int x = x0 + i * (w + gap);
              roehre(x, 72, w, h, z[i]);
              if (punkt == i + 1) {               // Neon-Punkt zwischen den Roehren
                it.filled_circle(x + w + gap / 2, 72 + h - 22, 4, GLUT_R);
                it.filled_circle(x + w + gap / 2, 72 + h - 22, 2, GLUT);
              }
            }
            gluehen(x0 + breite + 8, 76, id(rb18), TextAlign::TOP_LEFT, "°C", 1);
          } else {
            it.print(160, 120, id(rb18), ROT, TextAlign::TOP_CENTER, "keine Daten");
          }

          // ----- Aussenwerte -----
          auto feld = [&](int nr, const char *symbol, bool ok, Color wf, const char *text) {
            int x = 12 + nr * 75;
            it.print(x, 226, id(mdi_icons_klein), AMBER_D, symbol);
            it.print(x + 20, 228, id(rb13), ok ? wf : ROT, ok ? text : "--");
          };
          char buf[16];
          bool ok = id(sensor_luxmeter_aussen_luftfeuchtigkeit).has_state();
          snprintf(buf, sizeof(buf), "%.0f%%", id(sensor_luxmeter_aussen_luftfeuchtigkeit).state);
          feld(0, "\U000F058E", ok, AMBER, buf);
          ok = id(sensor_luxmeter_aussen_luftdruck).has_state();
          float druck = id(sensor_luxmeter_aussen_luftdruck).state;
          Color df = AMBER;
          if (druck < 1000) df = GELB; else if (druck > 1030) df = ROT;
          snprintf(buf, sizeof(buf), "%d hPa", (int) druck);
          feld(1, "\U000F029A", ok, df, buf);
          ok = id(wind_speed_kmh).has_state();
          snprintf(buf, sizeof(buf), "%.1f km/h", id(wind_speed_kmh).state);
          feld(2, "\U000F059D", ok, AMBER, buf);
          ok = id(aussenfuhler_umgebungslicht).has_state();
          snprintf(buf, sizeof(buf), "%.1f lx", id(aussenfuhler_umgebungslicht).state);
          feld(3, "\U000F05A8", ok, AMBER, buf);
          trenn(252);

          // ----- Raumklima (Kueche = Innen zuerst) -----
          it.print(12, 258, id(rb13), AMBER_D, "RAUMKLIMA");
          it.print(236, 258, id(rb13), AMBER_D, TextAlign::TOP_RIGHT, "TEMP");
          it.print(308, 258, id(rb13), AMBER_D, TextAlign::TOP_RIGHT, "FEUCHTE");
          auto zeile = [&](int nr, const char *name, bool t_ok, float t, bool h_ok, float h) {
            int y = 276 + nr * 16;
            for (int px = 12; px < 308; px += 4) it.draw_pixel_at(px, y + 15, GITTER);
            it.print(12, y, id(rb14), AMBER_M, name);
            if (t_ok) it.printf(236, y, id(rb14), AMBER, TextAlign::TOP_RIGHT, "%.1f°", t);
            else      it.print(236, y, id(rb14), ROT, TextAlign::TOP_RIGHT, "--");
            Color hf = AMBER_D;
            if (h_ok) {
              hf = GRUEN;
              if (h >= 70) hf = ROT; else if (h >= 60) hf = GELB;
              it.printf(294, y, id(rb14), hf, TextAlign::TOP_RIGHT, "%.0f%%", h);
            } else {
              it.print(294, y, id(rb14), ROT, TextAlign::TOP_RIGHT, "--");
            }
            it.filled_circle(303, y + 7, 3, hf);
          };
          zeile(0, "Kueche (innen)",
            id(sensor_thermo_hygrometer_3_temperatur).has_state(), id(sensor_thermo_hygrometer_3_temperatur).state,
            id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).state);
          zeile(1, "Schlafzimmer oben",
            id(sensor_thermo_hygrometer_1_temperatur).has_state(), id(sensor_thermo_hygrometer_1_temperatur).state,
            id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).state);
          zeile(2, "Bad",
            id(sensor_thermo_hygrometer_4_temperatur).has_state(), id(sensor_thermo_hygrometer_4_temperatur).state,
            id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).state);
          zeile(3, "Schlafzimmer Mutti",
            id(sensor_thermo_hygrometer_2_temperatur).has_state(), id(sensor_thermo_hygrometer_2_temperatur).state,
            id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).state);
          zeile(4, "Werkstatt Ossi",
            id(sensor_thermo_hygrometer_5_temperatur).has_state(), id(sensor_thermo_hygrometer_5_temperatur).state,
            id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).state);
          zeile(5, "Heizraum Pumpe",
            id(sensor_thermo_hygrometer_6_temperatur).has_state(), id(sensor_thermo_hygrometer_6_temperatur).state,
            id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).state);
          zeile(6, "Retroraum",
            id(sensor_thermo_hygrometer_7_temperatur).has_state(), id(sensor_thermo_hygrometer_7_temperatur).state,
            id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).state);
          trenn(392);

          // ----- Strom Kueche + Server -----
          it.print(12, 398, id(rb13), AMBER_D, "STROM KUECHE");
          if (id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).has_state())
            it.printf(308, 398, id(rb13), AMBER_D, TextAlign::TOP_RIGHT, "SERVER %.0f W",
              id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).state);
          if (id(sensor_kuchl_steckdose_switch_0_voltage).has_state())
            it.printf(12, 414, id(rb18), AMBER, "%.1f V", id(sensor_kuchl_steckdose_switch_0_voltage).state);
          if (id(sensor_kuchl_steckdose_switch_0_current).has_state())
            it.printf(160, 414, id(rb18), AMBER, TextAlign::TOP_CENTER, "%.2f A", id(sensor_kuchl_steckdose_switch_0_current).state);
          if (id(sensor_kuchl_steckdose_switch_0_power).has_state())
            it.printf(308, 414, id(rb18), AMBER, TextAlign::TOP_RIGHT, "%.1f W", id(sensor_kuchl_steckdose_switch_0_power).state);
          trenn(442);

          // ----- Bitcoin -----
          if (id(bitcoin_preis).has_state()) {
            it.print(12, 452, id(rb14), AMBER_D, "BITCOIN");
            it.printf(308, 448, id(rb18), AMBER, TextAlign::TOP_RIGHT, "%.0f EUR", id(bitcoin_preis).state);
          }
