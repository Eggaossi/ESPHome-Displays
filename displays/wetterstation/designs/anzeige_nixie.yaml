# =====================================================================
#  Wetterstation by Ossi - Anzeige-Teil (Package fuer ESPHome)
#  DESIGN "Nixie" (Entwurf von Claude, 20.11.2026)
#  Wird von der Geraete-YAML im ESPHome Builder per "packages:" geholt.
#  Hier stehen: Zeit, Schriften, Taster, LEDs, Sensoren aus Home Assistant
#  und die Display-Zeichnung. KEINE Passwoerter/Schluessel (Repo oeffentlich).
#  Eigene Schriften (Ananda, Coffin, Cabaret, Roboto-Regular) liegen in
#  Home Assistant unter /config/esphome/fonts/.
# =====================================================================

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

font:
  - file: '/config/esphome/fonts/Ananda.ttf'
    id: my_font_ananda
    size: 26
  - file: '/config/esphome/fonts/Ananda.ttf'
    id: my_font_cabaret_klein
    size: 24
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin
    size: 28
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_miniklein
    size: 15
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_klein
    size: 18
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_benu
    size: 20
  # Riesige Aussentemperatur: nur die noetigen Zeichen, spart viel Speicher
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_gross
    size: 200
    glyphs: "-0123456789°"
  - file: '/config/esphome/fonts/Coffin.ttf'
    id: my_font_Coffin_extra
    size: 32
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_cabaret
    size: 37
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_minicabaret
    size: 26
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_miniminicabaret
    size: 22
  - file: '/config/esphome/fonts/Cabaret.ttf'
    id: my_font_groscabaret
    size: 40
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font
    size: 25
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font_medium
    size: 35
  - file: '/config/esphome/fonts/Roboto-Regular.ttf'
    id: my_font_large
    size: 50
  # Gut lesbare Schrift fuer kleine Texte (Roboto Bold, ESPHome laedt sie selbst)
  - file:
      type: gfonts
      family: Roboto
      weight: 900   # Black: bei 1-Bit-Darstellung wird die "1" sonst nur 1 Pixel breit
    id: rb13
    size: 13
  - file:
      type: gfonts
      family: Roboto
      weight: 900   # Black: bei 1-Bit-Darstellung wird die "1" sonst nur 1 Pixel breit
    id: rb14
    size: 14
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb16
    size: 16
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb18
    size: 18
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: rb28
    size: 28
  # Nixie-Ziffern (duenne Roboto, leuchten durch mehrfaches Zeichnen)
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: nixie_ziffer
    size: 120
    glyphs: "-0123456789"
  - file:
      type: gfonts
      family: Roboto
      weight: 300
    id: nixie_uhr
    size: 36
    glyphs: "0123456789:"
  # Symbole (Material Design Icons), ESPHome laedt die Datei beim Kompilieren
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 24
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny
      - "\U000F048B"  # server
      - "\U000F0241"  # flash
      - "\U000F0813"  # bitcoin
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_klein
    size: 18
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny

# Knopf in Home Assistant: sofort nach neuer Firmware schauen und einspielen
button:
  - platform: template
    name: "Jetzt Update holen"
    on_press:
      - script.execute: update_jetzt

script:
  - id: update_jetzt
    then:
      - component.update: fw_update
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(fw_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - update.perform: fw_update

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 1"
    id: wetterstation_taster_1
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 1 wurde gedrückt!"
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 2"
    id: wetterstation_taster_2
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 2 wurde gedrückt!"
      # Taster 2: sofort nach neuer Firmware auf GitHub schauen
      - script.execute: update_jetzt
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 3"
    id: wetterstation_taster_3
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 3 wurde gedrückt!"

output:
  - platform: gpio
    pin: GPIO14
    id: wetterstation_led_1
  - platform: gpio
    pin: GPIO13
    id: wetterstation_led_2
  - platform: gpio
    pin: GPIO12
    id: wetterstation_led_3

light:
  - platform: binary
    name: "Wetterstation-LED 1"
    output: wetterstation_led_1
  - platform: binary
    name: "Wetterstation-LED 2"
    output: wetterstation_led_2
  - platform: binary
    name: "Wetterstation-LED 3"
    output: wetterstation_led_3

