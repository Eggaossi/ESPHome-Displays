# =====================================================================
#  Wetterstation by Ossi - Anzeige-Teil (Package fuer ESPHome)
#  DESIGN "Original": die urspruengliche Anzeige des Nutzers (Stand 20.11.2026, alt/...ORIGINAL...yaml),
#  Zeichnung unveraendert uebernommen. Braucht die eigenen Schriften Ananda, Coffin, Cabaret
#  (fonts/*.ttf neben der Geraete-YAML, beim GitHub-Build aus dem privaten Schriften-Repo).
#  KEINE Passwoerter/Schluessel (Repo oeffentlich).
# =====================================================================

globals:
  # Tages-Tiefst/Hoechst der Aussentemperatur (bleibt auch nach Neustart)
  - id: hz_min
    type: float
    restore_value: true
    initial_value: '1000'
  - id: hz_max
    type: float
    restore_value: true
    initial_value: '-1000'
  - id: hz_tag
    type: int
    restore_value: true
    initial_value: '0'

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

font:
  - file: 'fonts/Ananda.ttf'
    id: my_font_ananda
    size: 26
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin
    size: 28
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_miniklein
    size: 15
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_klein
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_gross
    size: 200
    glyphs: "-0123456789°"
  - file: 'fonts/Cabaret.ttf'
    id: my_font_cabaret
    size: 37
  - file: 'fonts/Cabaret.ttf'
    id: my_font_minicabaret
    size: 26
  - file: 'fonts/Cabaret.ttf'
    id: my_font_miniminicabaret
    size: 22
  - file: 'fonts/Cabaret.ttf'
    id: my_font_groscabaret
    size: 40

# Knopf in Home Assistant: sofort nach neuer Firmware schauen und einspielen
button:
  - platform: template
    name: "Jetzt Update holen"
    on_press:
      - script.execute: update_jetzt

script:
  - id: update_jetzt
    then:
      - component.update: fw_update
      - delay: 10s
      - if:
          condition:
            lambda: 'return id(fw_update).state == update::UPDATE_STATE_AVAILABLE;'
          then:
            - update.perform: fw_update

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 1"
    id: wetterstation_taster_1
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 1 wurde gedrückt!"
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 2"
    id: wetterstation_taster_2
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 2 wurde gedrückt!"
      # Taster 2: sofort nach neuer Firmware auf GitHub schauen
      - script.execute: update_jetzt
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 3"
    id: wetterstation_taster_3
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 3 wurde gedrückt!"

output:
  - platform: gpio
    pin: GPIO14
    id: wetterstation_led_1
  - platform: gpio
    pin: GPIO13
    id: wetterstation_led_2
  - platform: gpio
    pin: GPIO12
    id: wetterstation_led_3

light:
  - platform: binary
    name: "Wetterstation-LED 1"
    output: wetterstation_led_1
  - platform: binary
    name: "Wetterstation-LED 2"
    output: wetterstation_led_2
  - platform: binary
    name: "Wetterstation-LED 3"
    output: wetterstation_led_3

