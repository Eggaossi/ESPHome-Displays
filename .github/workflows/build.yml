name: Displays bauen
on:
  push:
    branches: [main]
    paths: ['displays/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: firmware, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            displays/*/.esphome
            ~/.cache/vorschau
          key: esphome-${{ runner.os }}-${{ hashFiles('displays/*/*.yaml') }}
          restore-keys: esphome-${{ runner.os }}-
      - name: Werkzeuge fuer Vorschau
        run: pip install pyyaml pillow
      - name: Geaenderte Displays bestimmen
        id: welche
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(.github/workflows/|tools/)'; then
            LISTE=$(ls displays)
          else
            LISTE=$(git diff --name-only HEAD~1 HEAD | grep '^displays/' | cut -d/ -f2 | sort -u)
          fi
          echo "liste=$(echo $LISTE)" >> $GITHUB_OUTPUT
          echo "Baue: $LISTE"
      - name: Secrets-Datei anlegen
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          OTA_PASSWORD: ${{ secrets.OTA_PASSWORD }}
          WETTERSTATION_API_KEY: ${{ secrets.WETTERSTATION_API_KEY }}
        run: |
          for d in displays/*/; do
            {
              echo "wifi_ssid: \"$WIFI_SSID\""
              echo "wifi_password: \"$WIFI_PASSWORD\""
              echo "ota_password: \"$OTA_PASSWORD\""
              echo "wetterstation_api_key: \"$WETTERSTATION_API_KEY\""
            } > "$d/secrets.yaml"
          done
      - name: Firmware-Zweig holen
        run: |
          git fetch origin firmware:firmware 2>/dev/null && git worktree add fw firmware || {
            git worktree add --orphan -b firmware fw 2>/dev/null || { mkdir fw; cd fw; git init -q -b firmware; }
          }
      - name: Bauen
        # Jede fertige Firmware wird je Design aufgehoben (fw/<d>/lager/<design>/). Ist der Code
        # (Geraete-YAML + Design) seit dem letzten Bau gleich, wird sie nur freigegeben, ohne neu zu bauen.
        run: |
          set +e
          FEHLER=0
          ESPHOME_DA=0
          for d in ${{ steps.welche.outputs.liste }}; do
            mkdir -p fw/$d
            # Design aus design.txt aktivieren (wird von der App oder am Handy auf github.com geaendert)
            DES=""
            if [ -f displays/$d/design.txt ]; then
              DES=$(tr -d ' \r\n' < displays/$d/design.txt)
              if [ ! -f displays/$d/designs/anzeige_$DES.yaml ]; then
                echo "FEHLER Build ${{ github.run_number }}: Design '$DES' gibt es nicht (displays/$d/designs/anzeige_$DES.yaml)" > fw/$d/fehler.txt
                FEHLER=1; continue
              fi
              python3 tools/design_aktivieren.py displays/$d designs/anzeige_$DES.yaml
            fi
            LAGER=fw/$d/lager/${DES:-ohne}
            SCHLUESSEL=$(cat displays/$d/$d.yaml displays/$d/anzeige.yaml | sha256sum | cut -c1-16)
            if [ -f $LAGER/schluessel.txt ] && [ "$(cat $LAGER/schluessel.txt)" = "$SCHLUESSEL" ] && [ -f $LAGER/firmware.ota.bin ]; then
              NR=$(cat $LAGER/build.txt)
              echo "$d: $DES unveraendert, Firmware von Build $NR wird freigegeben (kein Neubau)"
              cp $LAGER/firmware.ota.bin fw/$d/firmware.ota.bin
              [ -f $LAGER/firmware.factory.bin ] && cp $LAGER/firmware.factory.bin fw/$d/firmware.factory.bin
              ART="aufgehoben"
            else
              if [ $ESPHOME_DA = 0 ]; then pip install -q esphome; ESPHOME_DA=1; fi
              NR=${{ github.run_number }}
              esphome -s fw_version $NR compile displays/$d/$d.yaml > fw/$d/build.log 2>&1
              if [ $? -ne 0 ]; then
                echo "FEHLER Build $NR ($GITHUB_SHA)" > fw/$d/fehler.txt
                tail -n 80 fw/$d/build.log >> fw/$d/fehler.txt
                FEHLER=1; continue
              fi
              NAME=$(grep -m1 '^  name:' displays/$d/$d.yaml | awk '{print $2}')
              BIN=$(find displays/$d/.esphome/build/$NAME -name firmware.ota.bin | head -1)
              FAC=$(find displays/$d/.esphome/build/$NAME -name firmware.factory.bin | head -1)
              if [ -z "$BIN" ]; then echo "FEHLER Build $NR: firmware.ota.bin nicht gefunden" > fw/$d/fehler.txt; FEHLER=1; continue; fi
              cp "$BIN" fw/$d/firmware.ota.bin
              [ -n "$FAC" ] && cp "$FAC" fw/$d/firmware.factory.bin
              mkdir -p $LAGER
              cp fw/$d/firmware.ota.bin $LAGER/
              [ -f fw/$d/firmware.factory.bin ] && cp fw/$d/firmware.factory.bin $LAGER/
              echo "$SCHLUESSEL" > $LAGER/schluessel.txt
              echo "$NR" > $LAGER/build.txt
              ART="neu gebaut"
              tail -n 5 fw/$d/build.log
            fi
            rm -f fw/$d/fehler.txt
            MD5=$(md5sum fw/$d/firmware.ota.bin | cut -d' ' -f1)
            cat > fw/$d/manifest.json <<JSON
          {"name": "$d", "version": "$NR", "builds": [{"chipFamily": "ESP32-S3",
            "ota": {"path": "https://raw.githubusercontent.com/${{ github.repository }}/firmware/$d/firmware.ota.bin",
                    "md5": "$MD5", "summary": "Build $NR ($ART) Design $DES"}}]}
          JSON
            echo "Build $NR von ${GITHUB_SHA::7} Design $DES ($ART, Lauf ${{ github.run_number }})" > fw/$d/version.txt
            echo "$DES" > fw/$d/design.txt
          done
          echo "FEHLER=$FEHLER" >> $GITHUB_ENV
      - name: Vorschaubilder zeichnen
        # aus genau dem Display-Code der Designs (tools/vorschau.py), fuer die App HA-Displays
        run: |
          set +e
          for d in ${{ steps.welche.outputs.liste }}; do
            mkdir -p fw/$d/vorschau
            if [ -f displays/$d/designs.txt ]; then
              IDS=$(grep -v '^#' displays/$d/designs.txt | cut -d= -f1 | tr -d ' \r')
            else
              IDS=$(ls displays/$d/designs/ | sed -n 's/^anzeige_\(.*\)\.yaml$/\1/p')
            fi
            for id in $IDS; do
              python3 tools/vorschau.py displays/$d/designs/anzeige_$id.yaml fw/$d/vorschau/$id.png --cache ~/.cache/vorschau \
                || echo "Vorschau $id fehlgeschlagen"
            done
          done
      - name: Firmware-Zweig hochladen
        run: |
          cd fw
          git config user.name "github-actions"; git config user.email "actions@github.com"
          # immer nur ein Stand ohne Verlauf (sonst waechst der Zweig mit jeder Firmware)
          git checkout -q --orphan neu
          git add -A
          git commit -qm "Lauf ${{ github.run_number }} von ${GITHUB_SHA::7}" || true
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git HEAD:firmware
      - name: Ergebnis
        run: test "$FEHLER" = "0"
