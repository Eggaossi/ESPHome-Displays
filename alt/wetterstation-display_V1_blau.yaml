    accuracy_decimals: 1

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17


display:
  - platform: ili9xxx
    model: ST7796
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    color_palette: 8bit
    rotation: 0
    invert_colors: false
    update_interval: 5s
    lambda: |-
      // ===== Farben (auf 8-Bit-Palette abgestimmt) =====
      const Color HINTERGRUND = Color(0, 0, 0);
      const Color PANEL       = Color(0, 0, 85);
      const Color PANEL_HELL  = Color(0, 36, 85);
      const Color KOPF        = Color(0, 73, 170);
      const Color LINIE       = Color(36, 109, 170);
      const Color WEISS       = Color(255, 255, 255);
      const Color GELB        = Color(255, 219, 0);
      const Color CYAN        = Color(0, 219, 255);
      const Color GRUEN       = Color(73, 219, 146);
      const Color ROT         = Color(255, 36, 0);
      const Color GRAU        = Color(146, 146, 170);

      it.fill(HINTERGRUND);

      // ===== Kopfleiste =====
      it.filled_rectangle(0, 0, 320, 36, KOPF);
      it.print(160, 4, id(my_font_ananda), WEISS, TextAlign::TOP_CENTER, "Wetterstation by Ossi");

      // ===== Wochentag, Datum, Uhrzeit =====
      auto time = id(sntp_time).now();
      if (time.is_valid()) {
        const char* wochentage[] = {"Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"};
        it.printf(8, 42, id(my_font_Coffin_benu), CYAN, "%s", wochentage[(time.day_of_week + 5) % 7]);
        it.printf(8, 62, id(my_font_Coffin_benu), WEISS, "%02d.%02d.%04d", time.day_of_month, time.month, time.year);
        it.printf(312, 40, id(my_font_cabaret), GELB, TextAlign::TOP_RIGHT, "%02d:%02d", time.hour, time.minute);
      } else {
        it.print(8, 50, id(my_font_Coffin_benu), GRAU, "Warte auf Zeit...");
      }
      it.horizontal_line(0, 84, 320, LINIE);

      // ===== Grosse Aussentemperatur mit Farbskala =====
      if (id(sensor_luxmeter_lux_korrigierte_temperatur).has_state()) {
        float temp_aussen = id(sensor_luxmeter_lux_korrigierte_temperatur).state;
        int t = (int) roundf(temp_aussen);
        Color temp_color;
        if (t < -15)      temp_color = Color(0, 0, 170);
        else if (t < -10) temp_color = Color(0, 0, 255);
        else if (t < -5)  temp_color = Color(0, 182, 255);
        else if (t < 0)   temp_color = Color(0, 255, 255);
        else if (t < 5)   temp_color = Color(0, 255, 146);
        else if (t < 10)  temp_color = Color(182, 255, 85);
        else if (t < 15)  temp_color = Color(255, 255, 0);
        else if (t < 20)  temp_color = Color(255, 146, 0);
        else if (t < 25)  temp_color = Color(255, 219, 0);
        else if (t < 30)  temp_color = Color(255, 255, 255);
        else              temp_color = Color(255, 255, 170);
        it.printf(160, 76, id(my_font_Coffin_gross), temp_color, TextAlign::TOP_CENTER, "%d°", t);
      } else {
        it.print(160, 76, id(my_font_Coffin_gross), ROT, TextAlign::TOP_CENTER, "--");
      }

      // ===== Leiste unter der Temperatur: Aussenwerte mit Symbolen =====
      // 4 Felder a 80 px: Feuchte | Luftdruck | Wind | Helligkeit
      auto feld = [&](int nr, const char* symbol, Color sf, bool ok, Color wf, const char* text) {
        int x = nr * 80;
        it.print(x + 6, 237, id(mdi_icons_klein), sf, symbol);
        it.print(x + 26, 240, id(my_font_Coffin_miniklein), ok ? wf : ROT, ok ? text : "--");
      };
      char buf[16];

      bool ok = id(sensor_luxmeter_aussen_luftfeuchtigkeit).has_state();
      snprintf(buf, sizeof(buf), "%.0f%%", id(sensor_luxmeter_aussen_luftfeuchtigkeit).state);
      feld(0, "\U000F058E", CYAN, ok, WEISS, buf);

      ok = id(sensor_luxmeter_aussen_luftdruck).has_state();
      float druck = id(sensor_luxmeter_aussen_luftdruck).state;
      Color druck_farbe = WEISS;                 // gelb unter 1000, rot ueber 1030
      if (druck < 1000) druck_farbe = GELB;
      else if (druck > 1030) druck_farbe = ROT;
      snprintf(buf, sizeof(buf), "%d hPa", (int) druck);
      feld(1, "\U000F029A", CYAN, ok, druck_farbe, buf);

      ok = id(wind_speed_kmh).has_state();
      snprintf(buf, sizeof(buf), "%.1f km/h", id(wind_speed_kmh).state);
      feld(2, "\U000F059D", CYAN, ok, WEISS, buf);

      ok = id(aussenfuhler_umgebungslicht).has_state();
      snprintf(buf, sizeof(buf), "%.1f lx", id(aussenfuhler_umgebungslicht).state);
      feld(3, "\U000F05A8", GELB, ok, WEISS, buf);

      // ===== Raum-Tabelle =====
      it.filled_rectangle(3, 260, 314, 120, PANEL);
      it.rectangle(3, 260, 314, 120, LINIE);
      it.print(10, 263, id(my_font_Coffin_miniklein), CYAN, "Raum");
      it.print(235, 263, id(my_font_Coffin_miniklein), CYAN, TextAlign::TOP_RIGHT, "Temp");
      it.print(308, 263, id(my_font_Coffin_miniklein), CYAN, TextAlign::TOP_RIGHT, "Feuchte");
      it.horizontal_line(6, 280, 308, LINIE);

      auto zeile = [&](int nr, const char* name, bool t_ok, float t, bool h_ok, float h) {
        int y = 283 + nr * 16;
        if (nr % 2 == 1) it.filled_rectangle(4, y - 1, 312, 16, PANEL_HELL);
        it.print(10, y, id(my_font_Coffin_miniklein), WEISS, name);
        if (t_ok) it.printf(235, y, id(my_font_Coffin_miniklein), GRUEN, TextAlign::TOP_RIGHT, "%.1f°C", t);
        else      it.print(235, y, id(my_font_Coffin_miniklein), ROT, TextAlign::TOP_RIGHT, "--");
        if (h_ok) {
          Color hf = GRUEN;
          if (h >= 70) hf = ROT;
          else if (h >= 60) hf = GELB;
          it.printf(308, y, id(my_font_Coffin_miniklein), hf, TextAlign::TOP_RIGHT, "%.0f%%", h);
        } else {
          it.print(308, y, id(my_font_Coffin_miniklein), ROT, TextAlign::TOP_RIGHT, "--");
        }
      };

      zeile(0, "Schlafzimmer oben",
        id(sensor_thermo_hygrometer_1_temperatur).has_state(), id(sensor_thermo_hygrometer_1_temperatur).state,
        id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).state);
      zeile(1, "Bad",
        id(sensor_thermo_hygrometer_4_temperatur).has_state(), id(sensor_thermo_hygrometer_4_temperatur).state,
        id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).state);
      zeile(2, "Schlafzimmer Mutti",
        id(sensor_thermo_hygrometer_2_temperatur).has_state(), id(sensor_thermo_hygrometer_2_temperatur).state,
        id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).state);
      zeile(3, "Werkstatt Ossi",
        id(sensor_thermo_hygrometer_5_temperatur).has_state(), id(sensor_thermo_hygrometer_5_temperatur).state,
        id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).state);
      zeile(4, "Heizraum Pumpe",
        id(sensor_thermo_hygrometer_6_temperatur).has_state(), id(sensor_thermo_hygrometer_6_temperatur).state,
        id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).state);
      zeile(5, "Retroraum",
        id(sensor_thermo_hygrometer_7_temperatur).has_state(), id(sensor_thermo_hygrometer_7_temperatur).state,
        id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).state);

      // ===== Kachel Server =====
      it.filled_rectangle(3, 386, 92, 44, PANEL);
      it.rectangle(3, 386, 92, 44, LINIE);
      it.print(8, 396, id(mdi_icons), Color(219, 182, 146), "\U000F048B");
      if (id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).has_state())
        it.printf(90, 394, id(my_font_minicabaret), Color(219, 182, 146), TextAlign::TOP_RIGHT, "%.0fW",
          id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).state);
      else
        it.print(90, 394, id(my_font_minicabaret), ROT, TextAlign::TOP_RIGHT, "--");

      // ===== Kachel Kueche (Spannung / Strom / Leistung) =====
      it.filled_rectangle(99, 386, 218, 44, PANEL);
      it.rectangle(99, 386, 218, 44, LINIE);
      it.print(104, 396, id(mdi_icons), GELB, "\U000F0241");
      if (id(sensor_kuchl_steckdose_switch_0_voltage).has_state())
        it.printf(130, 398, id(my_font_Coffin_benu), Color(146, 182, 219), "%.1fV", id(sensor_kuchl_steckdose_switch_0_voltage).state);
      else
        it.print(130, 398, id(my_font_Coffin_benu), ROT, "--");
      if (id(sensor_kuchl_steckdose_switch_0_current).has_state())
        it.printf(203, 398, id(my_font_Coffin_benu), Color(255, 109, 85), "%.2fA", id(sensor_kuchl_steckdose_switch_0_current).state);
      else
        it.print(203, 398, id(my_font_Coffin_benu), ROT, "--");
      if (id(sensor_kuchl_steckdose_switch_0_power).has_state())
        it.printf(312, 398, id(my_font_Coffin_benu), Color(182, 219, 85), TextAlign::TOP_RIGHT, "%.1fW", id(sensor_kuchl_steckdose_switch_0_power).state);
      else
        it.print(312, 398, id(my_font_Coffin_benu), ROT, TextAlign::TOP_RIGHT, "--");

      // ===== Kachel Bitcoin =====
      it.filled_rectangle(3, 434, 314, 44, PANEL);
      it.rectangle(3, 434, 314, 44, LINIE);
      it.print(12, 444, id(mdi_icons), Color(255, 182, 0), "\U000F0813");
      if (id(bitcoin_preis).has_state())
        it.printf(172, 437, id(my_font_cabaret), Color(255, 219, 85), TextAlign::TOP_CENTER, "%.0f EUR", id(bitcoin_preis).state);
      else
        it.print(172, 437, id(my_font_cabaret), ROT, TextAlign::TOP_CENTER, "--");
