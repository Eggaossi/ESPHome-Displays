esphome:
  name: wetterstation-display
  friendly_name: Wetterstation-Display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "ENTFERNT"

ota:
  - platform: esphome
    password: "ENTFERNT"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wetterstation-Display"
    password: "ENTFERNT"

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

font:
  - file: 'fonts/Ananda.ttf'
    id: my_font_ananda
    size: 26
  - file: 'fonts/Ananda.ttf'
    id: my_font_cabaret_klein
    size: 24
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin
    size: 28
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_miniklein
    size: 15
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_klein
    size: 18
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_benu
    size: 20
  # Riesige Aussentemperatur: nur die noetigen Zeichen, spart viel Speicher
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_gross
    size: 200
    glyphs: "-0123456789°"
  - file: 'fonts/Coffin.ttf'
    id: my_font_Coffin_extra
    size: 32
  - file: 'fonts/Cabaret.ttf'
    id: my_font_cabaret
    size: 37
  - file: 'fonts/Cabaret.ttf'
    id: my_font_minicabaret
    size: 26
  - file: 'fonts/Cabaret.ttf'
    id: my_font_miniminicabaret
    size: 22
  - file: 'fonts/Cabaret.ttf'
    id: my_font_groscabaret
    size: 40
  - file: 'fonts/Roboto-Regular.ttf'
    id: my_font
    size: 25
  - file: 'fonts/Roboto-Regular.ttf'
    id: my_font_medium
    size: 35
  - file: 'fonts/Roboto-Regular.ttf'
    id: my_font_large
    size: 50
  # Symbole (Material Design Icons), ESPHome laedt die Datei beim Kompilieren
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons
    size: 24
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny
      - "\U000F048B"  # server
      - "\U000F0241"  # flash
      - "\U000F0813"  # bitcoin
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_icons_klein
    size: 18
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F059D"  # weather-windy
      - "\U000F05A8"  # white-balance-sunny

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO11
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 1"
    id: wetterstation_taster_1
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 1 wurde gedrückt!"
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 2"
    id: wetterstation_taster_2
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 2 wurde gedrückt!"
  - platform: gpio
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    name: "Wetterstation-Taster 3"
    id: wetterstation_taster_3
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "Wetterstation-Taster 3 wurde gedrückt!"

output:
  - platform: gpio
    pin: GPIO14
    id: wetterstation_led_1
  - platform: gpio
    pin: GPIO13
    id: wetterstation_led_2
  - platform: gpio
    pin: GPIO12
    id: wetterstation_led_3

light:
  - platform: binary
    name: "Wetterstation-LED 1"
    output: wetterstation_led_1
  - platform: binary
    name: "Wetterstation-LED 2"
    output: wetterstation_led_2
  - platform: binary
    name: "Wetterstation-LED 3"
    output: wetterstation_led_3

