spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17


display:
  - platform: ili9xxx
    model: ST7796
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    color_palette: 8bit
    rotation: 0
    invert_colors: false
    update_interval: 5s
    id: anzeige_display
    pages:
      - id: seite_haupt
        lambda: |-
          // =========== Design "Hauswetter": Mokka-Karten, Goldrahmen, grosse Aussentemperatur ===========
          const Color HINTERGRUND = Color(36, 0, 0);
          const Color KARTE       = Color(73, 36, 0);
          const Color GOLD        = Color(255, 182, 0);
          const Color GOLD_DUNKEL = Color(146, 109, 0);
          const Color OCKER       = Color(219, 182, 0);
          const Color WEISS       = Color(255, 255, 255);
          const Color GRUEN       = Color(73, 219, 0);
          const Color GELB        = Color(255, 255, 0);
          const Color ROT         = Color(255, 36, 0);
          const Color KORALLE     = Color(255, 109, 0);

          it.fill(HINTERGRUND);

          // ----- Helfer -----
          auto karte = [&](int x, int y, int w, int h) {
            int r = 6;
            it.filled_rectangle(x + r, y, w - 2 * r, h, KARTE);
            it.filled_rectangle(x, y + r, w, h - 2 * r, KARTE);
            it.filled_circle(x + r, y + r, r, KARTE);
            it.filled_circle(x + w - r - 1, y + r, r, KARTE);
            it.filled_circle(x + r, y + h - r - 1, r, KARTE);
            it.filled_circle(x + w - r - 1, y + h - r - 1, r, KARTE);
          };
          auto kopf = [&](int x, int y, const char *txt) {
            it.filled_rectangle(x, y + 3, 3, 10, GOLD);
            it.print(x + 8, y, id(rb13), GOLD, txt);
          };
          auto ecke = [&](int x, int y, int dx, int dy) {
            for (int k = 0; k < 2; k++) {
              int o = 5 + k * 4;
              int len = 12 - k * 5;
              int px = x + dx * o;
              int py = y + dy * o;
              it.line(px, py, px + dx * len, py, GOLD_DUNKEL);
              it.line(px, py, px, py + dy * len, GOLD_DUNKEL);
            }
          };
          auto feuchte_farbe = [&](float h) -> Color {
            if (h >= 70) return ROT;
            if (h >= 60) return GELB;
            return GRUEN;
          };
          auto temp_farbe = [&](float t) -> Color {
            if (t < -10) return Color(182, 219, 255);
            if (t < 0)   return Color(219, 255, 255);
            if (t < 5)   return Color(255, 255, 255);
            if (t < 10)  return Color(219, 255, 85);
            if (t < 15)  return Color(255, 255, 0);
            if (t < 20)  return Color(255, 219, 0);
            if (t < 25)  return Color(255, 182, 0);
            if (t < 30)  return Color(255, 109, 0);
            return Color(255, 36, 0);
          };

          // ----- Rahmen: duenne Goldlinie, zwei Winkel je Ecke -----
          it.rectangle(1, 1, 318, 478, GOLD_DUNKEL);
          ecke(0, 0, 1, 1);
          ecke(319, 0, -1, 1);
          ecke(0, 479, 1, -1);
          ecke(319, 479, -1, -1);

          // ----- Kopf: Tag/Datum links, Uhr rechts -----
          auto time = id(sntp_time).now();
          if (time.is_valid()) {
            const char *wochentage[] = {"Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"};
            it.printf(16, 10, id(rb18), WEISS, "%s", wochentage[(time.day_of_week + 5) % 7]);
            it.printf(16, 31, id(rb14), OCKER, "%02d.%02d.%04d", time.day_of_month, time.month, time.year);
            it.printf(306, 4, id(hz_uhr), GOLD, TextAlign::TOP_RIGHT, "%02d:%02d", time.hour, time.minute);
          } else {
            it.print(16, 18, id(rb16), OCKER, "warte auf Zeit...");
          }

          // ----- Tages-Tiefst/Hoechst (eigene Rechnung, Reset bei Datumswechsel) -----
          bool ta_ok = id(sensor_luxmeter_lux_korrigierte_temperatur).has_state();
          float ta = id(sensor_luxmeter_lux_korrigierte_temperatur).state;
          if (time.is_valid() && time.day_of_month != id(hz_tag)) {
            id(hz_tag) = time.day_of_month;
            id(hz_min) = 1000;
            id(hz_max) = -1000;
          }
          if (ta_ok) {
            if (ta < id(hz_min)) id(hz_min) = ta;
            if (ta > id(hz_max)) id(hz_max) = ta;
          }

          // ----- Karte Aussen -----
          karte(10, 56, 300, 160);
          kopf(18, 62, "AUSSEN");
          if (ta_ok) {
            Color tf = temp_farbe(ta);
            int ganz = (int) truncf(ta);
            int zehntel = (int) roundf(fabsf(ta - ganz) * 10);
            if (zehntel == 10) { zehntel = 0; ganz += (ta < 0) ? -1 : 1; }
            char g[8], z[8];
            if (ta < 0 && ganz == 0) snprintf(g, sizeof(g), "-0"); else snprintf(g, sizeof(g), "%d", ganz);
            snprintf(z, sizeof(z), ".%d°", zehntel);
            int x1, y1, w, h, z1, z2, zw, zh;
            it.get_text_bounds(0, 0, g, id(hz_temp), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            it.get_text_bounds(0, 0, z, id(hz_dez), TextAlign::TOP_LEFT, &z1, &z2, &zw, &zh);
            int x0 = 112 - (w + zw - 6) / 2;
            if (x0 < 14) x0 = 14;
            it.print(x0, 64, id(hz_temp), tf, g);
            it.print(x0 + w - 6, 82, id(hz_dez), tf, z);
          } else {
            it.print(112, 120, id(rb18), ROT, TextAlign::TOP_CENTER, "keine Daten");
          }
          if (id(hz_min) < 999)
            it.printf(112, 192, id(rb14), OCKER, TextAlign::TOP_CENTER, "heute  %.1f°  bis  %.1f°", id(hz_min), id(hz_max));

          it.vertical_line(214, 66, 140, GOLD_DUNKEL);
          auto wert = [&](int nr, const char *symbol, bool ok, Color wf, const char *text) {
            int y = 66 + nr * 36;
            it.print(222, y + 6, id(mdi_icons_klein), GOLD, symbol);
            it.print(244, y + 6, id(rb16), ok ? wf : ROT, ok ? text : "--");
          };
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f %%", id(sensor_luxmeter_aussen_luftfeuchtigkeit).state);
          wert(0, "\U000F058E", id(sensor_luxmeter_aussen_luftfeuchtigkeit).has_state(), WEISS, buf);
          float druck = id(sensor_luxmeter_aussen_luftdruck).state;
          Color df = WEISS;
          if (druck < 1000) df = GELB; else if (druck > 1030) df = ROT;
          snprintf(buf, sizeof(buf), "%d hPa", (int) druck);
          wert(1, "\U000F029A", id(sensor_luxmeter_aussen_luftdruck).has_state(), df, buf);
          snprintf(buf, sizeof(buf), "%.1f km/h", id(wind_speed_kmh).state);
          wert(2, "\U000F059D", id(wind_speed_kmh).has_state(), WEISS, buf);
          snprintf(buf, sizeof(buf), "%.1f lx", id(aussenfuhler_umgebungslicht).state);
          wert(3, "\U000F05A8", id(aussenfuhler_umgebungslicht).has_state(), WEISS, buf);

          // ----- Karte Raumklima, Kueche (innen) zuerst -----
          karte(10, 222, 300, 138);
          kopf(18, 227, "RAUMKLIMA");
          it.print(236, 227, id(rb13), OCKER, TextAlign::TOP_RIGHT, "Temp");
          it.print(302, 227, id(rb13), OCKER, TextAlign::TOP_RIGHT, "Feuchte");
          auto zeile = [&](int nr, const char *name, bool t_ok, float t, bool h_ok, float h) {
            int y = 244 + nr * 16;
            it.print(18, y, id(rb14), nr == 0 ? GOLD : WEISS, name);
            if (t_ok) it.printf(236, y, id(rb14), WEISS, TextAlign::TOP_RIGHT, "%.1f°C", t);
            else      it.print(236, y, id(rb14), ROT, TextAlign::TOP_RIGHT, "--");
            if (h_ok) {
              it.printf(290, y, id(rb14), feuchte_farbe(h), TextAlign::TOP_RIGHT, "%.0f%%", h);
              it.filled_circle(298, y + 7, 3, feuchte_farbe(h));
            } else {
              it.print(290, y, id(rb14), ROT, TextAlign::TOP_RIGHT, "--");
            }
          };
          zeile(0, "Kueche (innen)",
            id(sensor_thermo_hygrometer_3_temperatur).has_state(), id(sensor_thermo_hygrometer_3_temperatur).state,
            id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).state);
          zeile(1, "Schlafzimmer oben",
            id(sensor_thermo_hygrometer_1_temperatur).has_state(), id(sensor_thermo_hygrometer_1_temperatur).state,
            id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).state);
          zeile(2, "Bad",
            id(sensor_thermo_hygrometer_4_temperatur).has_state(), id(sensor_thermo_hygrometer_4_temperatur).state,
            id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).state);
          zeile(3, "Schlafzimmer Mutti",
            id(sensor_thermo_hygrometer_2_temperatur).has_state(), id(sensor_thermo_hygrometer_2_temperatur).state,
            id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).state);
          zeile(4, "Werkstatt Ossi",
            id(sensor_thermo_hygrometer_5_temperatur).has_state(), id(sensor_thermo_hygrometer_5_temperatur).state,
            id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).state);
          zeile(5, "Heizraum Pumpe",
            id(sensor_thermo_hygrometer_6_temperatur).has_state(), id(sensor_thermo_hygrometer_6_temperatur).state,
            id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).state);
          zeile(6, "Retroraum",
            id(sensor_thermo_hygrometer_7_temperatur).has_state(), id(sensor_thermo_hygrometer_7_temperatur).state,
            id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).state);


          // ----- Karte Strom Kueche + Server -----
          karte(10, 366, 300, 52);
          kopf(18, 371, "STROM KUECHE");
          if (id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).has_state())
            it.printf(302, 371, id(rb13), OCKER, TextAlign::TOP_RIGHT, "Server %.0f W",
              id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).state);
          if (id(sensor_kuchl_steckdose_switch_0_voltage).has_state())
            it.printf(18, 391, id(rb18), WEISS, "%.1f V", id(sensor_kuchl_steckdose_switch_0_voltage).state);
          if (id(sensor_kuchl_steckdose_switch_0_current).has_state())
            it.printf(160, 391, id(rb18), KORALLE, TextAlign::TOP_CENTER, "%.2f A", id(sensor_kuchl_steckdose_switch_0_current).state);
          if (id(sensor_kuchl_steckdose_switch_0_power).has_state())
            it.printf(302, 391, id(rb18), GRUEN, TextAlign::TOP_RIGHT, "%.1f W", id(sensor_kuchl_steckdose_switch_0_power).state);

          // ----- Karte Bitcoin -----
          karte(10, 424, 300, 44);
          kopf(18, 438, "BITCOIN");
          if (id(bitcoin_preis).has_state())
            it.printf(302, 430, id(rb28), GOLD, TextAlign::TOP_RIGHT, "%.0f EUR", id(bitcoin_preis).state);
          else
            it.print(302, 434, id(rb18), ROT, TextAlign::TOP_RIGHT, "--");
