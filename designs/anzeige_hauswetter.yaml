spi:
  clk_pin: GPIO18
  mosi_pin: GPIO17


display:
  - platform: ili9xxx
    model: ST7796
    cs_pin: GPIO7
    dc_pin: GPIO15
    reset_pin: GPIO16
    color_palette: 8bit
    rotation: 0
    invert_colors: false
    update_interval: 5s
    id: anzeige_display
    pages:
      - id: seite_haupt
        lambda: |-
          // =========== Design (Racing-Gruen / Messing / Anton-Schrift) ===========
          const Color HINTERGRUND = Color(0, 36, 0);
          const Color BAND        = Color(0, 73, 0);
          const Color MESSING     = Color(219, 182, 0);
          const Color MESSING_D   = Color(146, 109, 0);
          const Color MESSING_H   = Color(255, 219, 85);
          const Color WEISS       = Color(255, 255, 255);
          const Color GRUEN       = Color(146, 255, 0);
          const Color GELB        = Color(255, 255, 0);
          const Color ROT         = Color(255, 36, 0);
          const Color KORALLE     = Color(255, 146, 85);

          it.fill(HINTERGRUND);

          // ----- Helfer -----
          auto niete = [&](int x, int y) {
            it.filled_circle(x, y, 3, MESSING_D);
            it.filled_circle(x, y, 2, MESSING);
            it.draw_pixel_at(x - 1, y - 1, MESSING_H);
          };
          auto band = [&](int y, int h) { it.filled_rectangle(8, y, 304, h, BAND); };
          auto feuchte_farbe = [&](float h) -> Color {
            if (h >= 70) return ROT;
            if (h >= 60) return GELB;
            return GRUEN;
          };
          auto temp_farbe = [&](float t) -> Color {
            if (t < -10) return Color(182, 219, 255);
            if (t < 0)   return Color(219, 255, 255);
            if (t < 5)   return Color(255, 255, 255);
            if (t < 10)  return Color(219, 255, 85);
            if (t < 15)  return Color(255, 255, 0);
            if (t < 20)  return Color(255, 219, 0);
            if (t < 25)  return Color(255, 182, 0);
            if (t < 30)  return Color(255, 109, 0);
            return Color(255, 36, 0);
          };

          // ----- Rahmen: Typenschild, doppelt Messing, Nieten -----
          it.rectangle(0, 0, 320, 480, MESSING);
          it.rectangle(3, 3, 314, 474, MESSING_D);
          niete(10, 10);  niete(309, 10);  niete(10, 469);  niete(309, 469);

          // ----- Kopfband: Datum links, Uhr rechts -----
          band(18, 46);
          auto time = id(sntp_time).now();
          if (time.is_valid()) {
            const char *wochentage[] = {"Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"};
            it.printf(16, 22, id(rc18), WEISS, TextAlign::TOP_LEFT, "%s", wochentage[(time.day_of_week + 5) % 7]);
            it.printf(16, 43, id(rc14), MESSING, TextAlign::TOP_LEFT, "%02d.%02d.%04d", time.day_of_month, time.month, time.year);
            it.printf(304, 4, id(an_uhr), MESSING_H, TextAlign::TOP_RIGHT, "%02d:%02d", time.hour, time.minute);
          } else {
            it.print(16, 32, id(rc16), MESSING, TextAlign::TOP_LEFT, "warte auf Zeit...");
          }

          // ----- Tages-Tiefst/Hoechst (eigene Rechnung, Reset bei Datumswechsel) -----
          bool ta_ok = id(sensor_luxmeter_lux_korrigierte_temperatur).has_state();
          float ta = id(sensor_luxmeter_lux_korrigierte_temperatur).state;
          if (time.is_valid() && time.day_of_month != id(hz_tag)) {
            id(hz_tag) = time.day_of_month;
            id(hz_min) = 1000;
            id(hz_max) = -1000;
          }
          if (ta_ok) {
            if (ta < id(hz_min)) id(hz_min) = ta;
            if (ta > id(hz_max)) id(hz_max) = ta;
          }

          // ----- Aussen: Temperatur gross links, Werte rechts -----
          it.print(16, 66, id(rc13), MESSING, TextAlign::TOP_LEFT, "AUSSEN");
          if (ta_ok) {
            // ganze Grad ohne Komma; bei breiten Werten (z.B. -15) kleinere Schrift
            Color tf = temp_farbe(ta);
            int t = (int) roundf(ta);
            char g[8];
            snprintf(g, sizeof(g), "%d", t);
            esphome::display::BaseFont *f = id(an_temp);
            int x1, y1, w, h, gx, gy, gw, gh;
            it.get_text_bounds(0, 0, g, f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            it.get_text_bounds(0, 0, "°", id(an_dez), TextAlign::TOP_LEFT, &gx, &gy, &gw, &gh);
            int yoff = 33;
            if (w + gw > 196) {
              f = id(an_temp_k);
              it.get_text_bounds(0, 0, g, f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
              yoff = 47;
            }
            int x0 = 108 - (w + gw) / 2;
            if (x0 < 12) x0 = 12;
            it.print(x0, yoff, f, tf, TextAlign::TOP_LEFT, g);
            it.print(x0 + w + 2, 61, id(an_dez), tf, TextAlign::TOP_LEFT, "°");
          } else {
            it.print(108, 130, id(rc18), ROT, TextAlign::TOP_CENTER, "keine Daten");
          }
          if (id(hz_min) < 999)
            it.printf(108, 218, id(rc14), MESSING, TextAlign::TOP_CENTER, "heute  %.1f°  bis  %.1f°", id(hz_min), id(hz_max));

          it.vertical_line(212, 76, 156, MESSING_D);
          auto wert = [&](int nr, const char *symbol, bool ok, Color wf, const char *text) {
            int y = 80 + nr * 38;
            it.print(220, y + 6, id(mdi_icons_klein), MESSING, TextAlign::TOP_LEFT, symbol);
            it.print(242, y + 6, id(rc18), ok ? wf : ROT, TextAlign::TOP_LEFT, ok ? text : "--");
          };
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f %%", id(sensor_luxmeter_aussen_luftfeuchtigkeit).state);
          wert(0, "\U000F058E", id(sensor_luxmeter_aussen_luftfeuchtigkeit).has_state(), WEISS, buf);
          float druck = id(sensor_luxmeter_aussen_luftdruck).state;
          Color df = WEISS;
          if (druck < 1000) df = GELB; else if (druck > 1030) df = ROT;
          snprintf(buf, sizeof(buf), "%d hPa", (int) druck);
          wert(1, "\U000F029A", id(sensor_luxmeter_aussen_luftdruck).has_state(), df, buf);
          snprintf(buf, sizeof(buf), "%.1f km/h", id(wind_speed_kmh).state);
          wert(2, "\U000F059D", id(wind_speed_kmh).has_state(), WEISS, buf);
          snprintf(buf, sizeof(buf), "%.1f lx", id(aussenfuhler_umgebungslicht).state);
          wert(3, "\U000F05A8", id(aussenfuhler_umgebungslicht).has_state(), WEISS, buf);

          // ----- Raumklima: Kopfband, Zeilen abwechselnd hinterlegt -----
          band(240, 18);
          it.print(16, 242, id(rc13), MESSING_H, TextAlign::TOP_LEFT, "RAUMKLIMA");
          it.print(236, 242, id(rc13), MESSING, TextAlign::TOP_RIGHT, "Temp");
          it.print(304, 242, id(rc13), MESSING, TextAlign::TOP_RIGHT, "Feuchte");
          auto zeile = [&](int nr, const char *name, bool t_ok, float t, bool h_ok, float h) {
            int y = 260 + nr * 17;
            if (nr % 2 == 1) it.filled_rectangle(8, y - 1, 304, 17, BAND);
            it.print(16, y, id(rc14), nr == 0 ? MESSING_H : WEISS, TextAlign::TOP_LEFT, name);
            if (t_ok) it.printf(236, y, id(rc14), WEISS, TextAlign::TOP_RIGHT, "%.1f°C", t);
            else      it.print(236, y, id(rc14), ROT, TextAlign::TOP_RIGHT, "--");
            if (h_ok) {
              it.printf(292, y, id(rc14), feuchte_farbe(h), TextAlign::TOP_RIGHT, "%.0f%%", h);
              it.filled_circle(301, y + 7, 3, feuchte_farbe(h));
            } else {
              it.print(292, y, id(rc14), ROT, TextAlign::TOP_RIGHT, "--");
            }
          };
          zeile(0, "Kueche (innen)",
            id(sensor_thermo_hygrometer_3_temperatur).has_state(), id(sensor_thermo_hygrometer_3_temperatur).state,
            id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_3_luftfeuchtigkeit).state);
          zeile(1, "Schlafzimmer oben",
            id(sensor_thermo_hygrometer_1_temperatur).has_state(), id(sensor_thermo_hygrometer_1_temperatur).state,
            id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_1_luftfeuchtigkeit).state);
          zeile(2, "Bad",
            id(sensor_thermo_hygrometer_4_temperatur).has_state(), id(sensor_thermo_hygrometer_4_temperatur).state,
            id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_4_luftfeuchtigkeit).state);
          zeile(3, "Schlafzimmer Mutti",
            id(sensor_thermo_hygrometer_2_temperatur).has_state(), id(sensor_thermo_hygrometer_2_temperatur).state,
            id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_2_luftfeuchtigkeit).state);
          zeile(4, "Werkstatt Ossi",
            id(sensor_thermo_hygrometer_5_temperatur).has_state(), id(sensor_thermo_hygrometer_5_temperatur).state,
            id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_5_luftfeuchtigkeit).state);
          zeile(5, "Heizraum Pumpe",
            id(sensor_thermo_hygrometer_6_temperatur).has_state(), id(sensor_thermo_hygrometer_6_temperatur).state,
            id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_6_luftfeuchtigkeit).state);
          zeile(6, "Retroraum",
            id(sensor_thermo_hygrometer_7_temperatur).has_state(), id(sensor_thermo_hygrometer_7_temperatur).state,
            id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).has_state(), id(sensor_thermo_hygrometer_7_luftfeuchtigkeit).state);


          // ----- Strom Kueche + Server -----
          band(384, 18);
          it.print(16, 386, id(rc13), MESSING_H, TextAlign::TOP_LEFT, "STROM KUECHE");
          if (id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).has_state())
            it.printf(304, 386, id(rc13), MESSING, TextAlign::TOP_RIGHT, "Server %.0f W",
              id(sensor_shellyplusplugs_e465b8b6b9e0_switch_0_power).state);
          if (id(sensor_kuchl_steckdose_switch_0_voltage).has_state())
            it.printf(16, 406, id(rc18), WEISS, TextAlign::TOP_LEFT, "%.1f V", id(sensor_kuchl_steckdose_switch_0_voltage).state);
          if (id(sensor_kuchl_steckdose_switch_0_current).has_state())
            it.printf(160, 406, id(rc18), KORALLE, TextAlign::TOP_CENTER, "%.2f A", id(sensor_kuchl_steckdose_switch_0_current).state);
          if (id(sensor_kuchl_steckdose_switch_0_power).has_state())
            it.printf(304, 406, id(rc18), GRUEN, TextAlign::TOP_RIGHT, "%.1f W", id(sensor_kuchl_steckdose_switch_0_power).state);

          // ----- Bitcoin -----
          band(432, 36);
          it.print(16, 443, id(rc13), MESSING_H, TextAlign::TOP_LEFT, "BITCOIN");
          if (id(bitcoin_preis).has_state())
            it.printf(304, 427, id(an_btc), MESSING_H, TextAlign::TOP_RIGHT, "%.0f EUR", id(bitcoin_preis).state);
          else
            it.print(304, 440, id(rc18), ROT, TextAlign::TOP_RIGHT, "--");
